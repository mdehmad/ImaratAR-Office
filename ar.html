<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Imarat | AR Viewer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#1c140e;color:#f3e7d8;overflow:hidden}
canvas{display:block}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;z-index:10;pointer-events:none}
#top a{pointer-events:auto;color:#f3e7d8;text-decoration:none;font-size:13px;letter-spacing:.12em;text-transform:uppercase;background:#0008;padding:8px 14px;border-radius:20px}
.word{font-family:Georgia,serif;letter-spacing:.3em;font-weight:600;font-size:18px;pointer-events:auto}
.word img{height:28px;display:block}
#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000d 35%);z-index:10;display:flex;flex-direction:column;gap:10px}
#msg{font-size:15px;text-align:center;line-height:1.4;min-height:21px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
button,.file{background:#4a3a2c;color:#fff;border:0;border-radius:22px;padding:10px 15px;font-size:13px;cursor:pointer;font-family:inherit}
button.main{background:#c8894a;font-size:15px;padding:13px 26px}
button.on{outline:2px solid #ffb060}
.file input{display:none}
label{font-size:12px;opacity:.85}
input[type=range]{width:110px;vertical-align:middle}
.hide{display:none!important}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.2em;text-transform:uppercase;z-index:5;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="top">
  <a href="index.html">‹ Back</a>
  <span class="word"><img src="logo.png" alt="IMARAT" onerror="this.replaceWith('IMARAT')"></span>
</div>
<div id="load">Loading model…</div>

<div id="ui">
  <div id="msg"></div>

  <!-- Preview-mode tools: pick the two reference columns on the MODEL -->
  <div class="row" id="previewTools">
    <button id="pickA">Set model point A</button>
    <button id="pickB">Set model point B</button>
    <button id="cut">Ceiling: on</button>
    <label class="file">Load model…<input type="file" id="file" accept=".glb,.gltf,.dae"></label>
  </div>

  <!-- AR-mode tools -->
  <div class="row hide" id="arTools">
    <button id="reset">Re-pick</button>
    <button id="rot">Rotate 90°</button>
    <button id="flip">Flip</button>
    <button id="toggle">Hide</button>
    <button id="cut2">Ceiling: on</button>
    <label><input type="checkbox" id="fit"> Fit to measured</label>
  </div>
  <div class="row hide" id="arTools2">
    <label>Height <input type="range" id="hgt" min="-0.5" max="0.5" step="0.01" value="0"></label>
    <label>Fine turn <input type="range" id="turn" min="-10" max="10" step="0.25" value="0"></label>
  </div>

  <div class="row"><button class="main hide" id="arbtn">Start AR</button></div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {ARButton} from 'three/addons/webxr/ARButton.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {ColladaLoader} from 'three/addons/loaders/ColladaLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';

/* =========================================================
   CONFIG
   Put your exported model next to this page as model.glb
   (or model.dae with its texture folder).
   Reference points A/B are in model metres (x,z on the floor).
   Leave null to pick them on the model in the 3D preview.
   ========================================================= */
const MODEL_FILES = ['model.glb','model.gltf','model.dae'];
let REF = {A:null, B:null};
try{const s=JSON.parse(localStorage.getItem('imaratRef')||'null');if(s)REF=s;}catch(e){}

const $=id=>document.getElementById(id);
const msg=t=>$('msg').textContent=t;

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.xr.enabled=true;renderer.localClippingEnabled=true;
const cutLocal=new THREE.Plane(new THREE.Vector3(0,-1,0),2.4),cutWorld=new THREE.Plane();let cutOn=false;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const bg=new THREE.Color(0x2a2018);scene.background=bg;
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.02,500);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xfff1dd,0x5a4632,1.3));
const sun=new THREE.DirectionalLight(0xffc888,1.4);sun.position.set(-10,16,8);scene.add(sun);
const grid=new THREE.GridHelper(60,60,0x6b5440,0x3a2d22);scene.add(grid);

/* Hierarchy: anchor (site A, site A→B dir) > aligned (model A→B mapped to +X) > content (model) */
const anchor=new THREE.Group(), aligned=new THREE.Group(), content=new THREE.Group();
anchor.add(aligned);aligned.add(content);scene.add(anchor);

/* Reference markers on the model */
const mk=c=>{const g=new THREE.Group();
  const p=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,3,16),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.55}));p.position.y=1.5;g.add(p);
  const r=new THREE.Mesh(new THREE.RingGeometry(0.25,0.35,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:c,side:2}));r.position.y=0.01;g.add(r);
  g.visible=false;content.add(g);return g};
const markA=mk(0xff5544), markB=mk(0x44b8ff);

let modelDist=1, extraRot=0, flip=1, fine=0, modelLoaded=false, bbox=new THREE.Box3();

function applyRef(){
  if(!REF.A||!REF.B){markA.visible=markB.visible=false;return;}
  const A=REF.A,B=REF.B,dx=B[0]-A[0],dz=B[1]-A[1];
  modelDist=Math.hypot(dx,dz)||1;
  content.position.set(-A[0],0,-A[1]);
  aligned.rotation.y=Math.atan2(dz,dx)+extraRot+fine*Math.PI/180;
  aligned.scale.z=flip;
  markA.position.set(A[0],bbox.min.y,A[1]);markB.position.set(B[0],bbox.min.y,B[1]);
  markA.visible=markB.visible=true;
}

/* ---------- model loading ---------- */
const draco=new DRACOLoader();draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const gltfL=new GLTFLoader();gltfL.setDRACOLoader(draco);gltfL.setMeshoptDecoder(MeshoptDecoder);
const daeL=new ColladaLoader();

function useModel(obj){
  content.children.filter(c=>c!==markA&&c!==markB).forEach(c=>content.remove(c));
  obj.updateMatrixWorld(true);
  bbox.setFromObject(obj);
  obj.position.y-=bbox.min.y;            // sit floor at y=0
  obj.updateMatrixWorld(true);bbox.setFromObject(obj);
  content.add(obj);
  obj.traverse(o=>{if(o.isMesh){o.frustumCulled=true;if(o.material&&o.material.map)o.material.map.anisotropy=4;}});
  modelLoaded=true;
  if(!REF.A||!REF.B){                       // default: two front corners of the bounding box
    REF={A:[bbox.min.x,bbox.min.z],B:[bbox.max.x,bbox.min.z]};
  }
  applyRef();
  const s=bbox.getSize(new THREE.Vector3()),c=bbox.getCenter(new THREE.Vector3());
  frameView();
  $('load').classList.add('hide');setCut(!renderer.xr.isPresenting);
  msg(`Model ${s.x.toFixed(1)} × ${s.z.toFixed(1)} m. Red = A, Blue = B. Set them on two columns you'll tap on site.`);
}
function frameView(){
  const b=new THREE.Box3().setFromObject(anchor),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
  const d=Math.max(s.x,s.z,4);camera.position.set(c.x+d*.35,c.y+d*1.1,c.z+d*.75);controls.target.copy(c);controls.update();
}
function loadURL(url,ext){
  return new Promise((res,rej)=>{
    const L=ext==='dae'?daeL:gltfL;
    L.load(url,r=>res(ext==='dae'?r.scene:r.scene),
      x=>{if(x.total)$('load').textContent=`Loading model… ${Math.round(x.loaded/x.total*100)}%`},rej);
  });
}
async function tryDefault(){
  for(const f of MODEL_FILES){
    try{const r=await fetch(f,{method:'HEAD'});if(!r.ok)continue;
      useModel(await loadURL(f,f.split('.').pop()));return;}catch(e){}
  }
  useModel(buildProp());
  msg('No model.glb found, showing placeholder layout. Use "Load model…" or add model.glb next to this page.');
}
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $('load').classList.remove('hide');$('load').textContent='Loading model…';
  REF={A:null,B:null};
  try{useModel(await loadURL(URL.createObjectURL(f),f.name.split('.').pop().toLowerCase()));}
  catch(err){msg('Could not read that file: '+err.message);$('load').classList.add('hide');}
};

/* Placeholder office if no model is present */
function buildProp(){
  const g=new THREE.Group(),M=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
  const oak=M(0xc99a63),walnut=M(0x6b4328),fab=M(0xd8ccbb,.95),terr=M(0xd9c7b2,.4),wh=M(0xf1ece4,.5);
  const box=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y+h/2,z);g.add(o)};
  box(14.6,.02,9.1,terr,7.3,0,4.55);
  for(const x of[0,7.3,14.6])for(const z of[0,9.1])box(.45,3,.45,wh,x,0,z);
  box(5,3,.1,walnut,3.6,0,8.9);box(3.2,1.1,.8,oak,3.6,0,7.4);
  box(3,.45,.9,fab,3.6,0,3.8);box(4.2,.75,1.3,oak,11,0,2);
  for(let c=0;c<3;c++)for(let r=0;r<2;r++)box(1.4,.75,.7,wh,9+c*1.7,0,5.6+r*1.8);
  return g;
}

/* ---------- pick reference points on the model (preview) ---------- */
let picking=null;const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
['A','B'].forEach(k=>$('pick'+k).onclick=()=>{picking=picking===k?null:k;
  $('pickA').classList.toggle('on',picking==='A');$('pickB').classList.toggle('on',picking==='B');
  if(picking)msg(`Tap the base of column ${k} on the model.`);});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!picking||renderer.xr.isPresenting)return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(content.children.filter(c=>c!==markA&&c!==markB),true)[0];if(!hit)return;
  const local=content.worldToLocal(hit.point.clone());
  REF[picking]=[+local.x.toFixed(3),+local.z.toFixed(3)];
  if(!REF.A)REF.A=REF[picking];if(!REF.B)REF.B=REF[picking];
  try{localStorage.setItem('imaratRef',JSON.stringify(REF))}catch(e){}
  applyRef();
  msg(`Point ${picking} set. A→B = ${modelDist.toFixed(2)} m (${(modelDist*3.281).toFixed(1)} ft).`);
  picking=null;$('pickA').classList.remove('on');$('pickB').classList.remove('on');
});

/* ---------- AR ---------- */
const reticle=new THREE.Mesh(new THREE.RingGeometry(.07,.1,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffb060}));
reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
let hitSource=null,points=[],pins=[],baseY=0,lastHit=null,xrAnchor=null,anchorStart=null;

function pin(p,c){const m=new THREE.Mesh(new THREE.SphereGeometry(.04),new THREE.MeshBasicMaterial({color:c}));m.position.copy(p);scene.add(m);pins.push(m)}
function place(){
  const [A,B]=points,dir=new THREE.Vector3().subVectors(B,A);dir.y=0;const meas=dir.length();
  baseY=A.y;anchor.position.set(A.x,baseY+ +$('hgt').value,A.z);
  anchor.rotation.set(0,Math.atan2(-dir.z,dir.x),0);
  anchor.scale.setScalar($('fit').checked?meas/modelDist:1);
  anchor.visible=true;markA.visible=markB.visible=false;anchorStart=null;
  const err=((meas-modelDist)/modelDist*100);
  msg(`Placed. Site ${meas.toFixed(2)} m vs model ${modelDist.toFixed(2)} m (${err>=0?'+':''}${err.toFixed(1)}%).`);
}
function onSelect(){
  if(!reticle.visible||points.length>=2)return;
  const p=new THREE.Vector3().setFromMatrixPosition(reticle.matrix);points.push(p);
  if(points.length===1&&lastHit&&lastHit.createAnchor){lastHit.createAnchor().then(a=>{xrAnchor=a;anchorStart=null}).catch(()=>{});}pin(p,points.length===1?0xff5544:0x44b8ff);
  if(points.length===1)msg('Column A marked. Now tap column B.');else place();
}
function resetPick(){if(xrAnchor){try{xrAnchor.delete()}catch(e){}}xrAnchor=null;anchorStart=null;points=[];pins.forEach(p=>scene.remove(p));pins=[];anchor.visible=false;msg('Scan the floor, then tap the base of column A.');}
$('reset').onclick=resetPick;
$('rot').onclick=()=>{extraRot+=Math.PI/2;applyRef()};
$('flip').onclick=()=>{flip*=-1;applyRef()};
$('toggle').onclick=()=>{anchor.visible=!anchor.visible;$('toggle').textContent=anchor.visible?'Hide':'Show'};
$('fit').onchange=()=>points.length===2&&place();
$('hgt').oninput=()=>{anchor.position.y=baseY+ +$('hgt').value;anchorStart=null;};
$('turn').oninput=()=>{fine=+$('turn').value;applyRef()};

const supported=navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
if(supported){
  const b=ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay','anchors'],domOverlay:{root:$('ui')}});
  b.style.display='none';document.body.appendChild(b);
  $('arbtn').classList.remove('hide');$('arbtn').onclick=()=>b.click();
}
const ctrl=renderer.xr.getController(0);ctrl.addEventListener('select',onSelect);scene.add(ctrl);

renderer.xr.addEventListener('sessionstart',async()=>{
  const s=renderer.xr.getSession();hitSource=await s.requestHitTestSource({space:await s.requestReferenceSpace('viewer')});
  scene.background=null;grid.visible=false;setCut(false);
  $('previewTools').classList.add('hide');$('arbtn').classList.add('hide');
  $('arTools').classList.remove('hide');$('arTools2').classList.remove('hide');
  resetPick();
});
renderer.xr.addEventListener('sessionend',()=>{
  hitSource=null;reticle.visible=false;pins.forEach(p=>scene.remove(p));pins=[];points=[];
  anchor.position.set(0,0,0);anchor.rotation.set(0,0,0);anchor.scale.setScalar(1);anchor.visible=true;
  scene.background=bg;grid.visible=true;applyRef();setCut(true);
  $('previewTools').classList.remove('hide');$('arbtn').classList.remove('hide');
  $('arTools').classList.add('hide');$('arTools2').classList.add('hide');frameView();
});

function setCut(v){cutOn=v;renderer.clippingPlanes=v?[cutWorld]:[];$('cut').textContent=$('cut2').textContent='Ceiling: '+(v?'off':'on');}
$('cut').onclick=$('cut2').onclick=()=>setCut(!cutOn);
renderer.setAnimationLoop((t,frame)=>{
  if(cutOn){content.updateMatrixWorld();cutWorld.copy(cutLocal).applyMatrix4(content.matrixWorld);}
  if(frame&&hitSource){
    const h=frame.getHitTestResults(hitSource);
    lastHit=h[0]||null;
    if(xrAnchor&&points.length===2){const ap=frame.getPose(xrAnchor.anchorSpace,renderer.xr.getReferenceSpace());
      if(ap){const v=new THREE.Vector3(ap.transform.position.x,ap.transform.position.y,ap.transform.position.z);
        if(!anchorStart)anchorStart={a:v.clone(),p:anchor.position.clone()};
        else anchor.position.copy(anchorStart.p).add(v.sub(anchorStart.a));}}
    if(h.length&&points.length<2){reticle.visible=true;reticle.matrix.fromArray(h[0].getPose(renderer.xr.getReferenceSpace()).transform.matrix);}
    else reticle.visible=false;
  }else controls.update();
  renderer.render(scene,camera);
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

if(!supported)setTimeout(()=>{if(modelLoaded)msg($('msg').textContent+'  (AR needs Chrome on Android, or a WebXR viewer app on iPad.)')},50);
tryDefault();
</script>
</body>
</html>
